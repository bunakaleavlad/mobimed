name: Generate Sitemap

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install xml-sitemap-generator
        run: npm install -g xml-sitemap-generator

      - name: Generate sitemap
        run: xml-sitemap-generator "https://mobimedx.com" --base-url "https://mobimedx.com" --output-file sitemap.xml

      - name: Check for changes
        id: git-check
        run: |
          if git diff --quiet sitemap.xml; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit sitemap
        if: steps.git-check.outputs.changed == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          git commit -m "chore: update sitemap.xml"
          git push
